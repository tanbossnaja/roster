<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Store the path and redirect to index.html with it
      var l = window.location;
      var path = l.pathname + l.search + l.hash;
      // Replace /repo/xxx -> ?p=/repo/xxx
      l.replace(l.origin + l.pathname.split('/').slice(0,2).join('/') + '/?p=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
