<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Redirect 404 -> /roster/index.html พร้อมเก็บ path เดิม
      var l = window.location;
      var repo = "/roster";
      var newUrl = repo + "/?p=" + encodeURIComponent(l.pathname.replace(repo, "")) + "&q=" + encodeURIComponent(l.search) + "&h=" + encodeURIComponent(l.hash);
      window.location.replace(newUrl);
    </script>
  </head>
  <body></body>
</html>
